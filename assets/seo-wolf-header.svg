<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="wolf-title wolf-desc">
  <title id="wolf-title">SEO Wolf</title>
  <desc id="wolf-desc">Self-hosted SEO crawler and site auditor. Crafted by @anhafxd.</desc>
  <defs>
    <linearGradient id="wolf-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2F6BFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#0A0E1A" stop-opacity="0"/>
    </linearGradient>
    <style>
      .wordmark { font: 700 76px "Space Grotesk", "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: 6px; fill: #E8ECF4; }
      .tagline { font: 500 24px Inter, "Segoe UI", Helvetica, Arial, sans-serif; fill: #8A93A6; }
      .signature { font: 500 16px "JetBrains Mono", Consolas, monospace; fill: #5B8CFF; }
      .scan { animation: sweep 4s ease-in-out infinite; }
      .eye { animation: blink 4s ease-in-out infinite; }
      @keyframes sweep { 0%, 100% { transform: translateX(0); opacity: 0.2; } 50% { transform: translateX(620px); opacity: 0.9; } }
      @keyframes blink { 0%, 92%, 100% { opacity: 1; } 95% { opacity: 0.2; } }
    </style>
  </defs>
  <rect width="1200" height="300" rx="24" fill="#0A0E1A"/>
  <rect width="1200" height="300" rx="24" fill="url(#wolf-glow)"/>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="24" fill="none" stroke="#1F2740"/>
  <g transform="translate(150 150)">
    <polygon points="0,-92 80,-46 80,46 0,92 -80,46 -80,-46" fill="#121829" stroke="#2F6BFF" stroke-width="3"/>
    <path d="M-46 -40 L-22 -12 L0 -30 L22 -12 L46 -40 L40 18 L0 56 L-40 18 Z" fill="none" stroke="#E8ECF4" stroke-width="3" stroke-linejoin="round"/>
    <circle class="eye" cx="-17" cy="6" r="6" fill="#E5383B"/>
    <circle cx="17" cy="6" r="6" fill="#5B8CFF"/>
  </g>
  <text class="wordmark" x="290" y="150">SEO WOLF</text>
  <text class="tagline" x="292" y="196">Paid-crawler power. Free, self-hosted, open source.</text>
  <rect class="scan" x="292" y="222" width="80" height="3" rx="1.5" fill="#E5383B"/>
  <text class="signature" x="1160" y="272" text-anchor="end">crafted by @anhafxd</text>
</svg>
